name: Publish Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and Publish Installer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read and verify release version
        id: version
        shell: bash
        run: |
          version="$(PYTHONPATH=src python3 -c "from rdp_session_manager.version import __version__; print(__version__)")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$version" != "$tag_version" ]]; then
            printf 'Tag %s does not match application version %s\n' \
              "$tag_version" "$version" >&2
            exit 1
          fi
          printf 'value=%s\n' "$version" >>"$GITHUB_OUTPUT"
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ruby ruby-dev rubygems build-essential zstd libarchive-tools \
            python3-gi python3-gi-cairo python3-psutil python3-rich python3-venv \
            gir1.2-gtk-4.0 gir1.2-adw-1
          sudo gem install --no-document fpm erb
          python3 -m venv --system-site-packages /tmp/rdpsm-ci
          /tmp/rdpsm-ci/bin/pip install -r installer/requirements.txt
          echo "/tmp/rdpsm-ci/bin" >> "$GITHUB_PATH"
      - name: Run release gates
        run: |
          python3 -m compileall -q src helpers tests installer
          find helpers installer tests -type f -name '*.sh' -print0 | xargs -0 bash -n
          python3 -m unittest discover -s tests -v
          bash tests/test_installer_bootstrap.sh
      - name: Build installer assets
        run: |
          bash installer/build_release_assets.sh \
            "$RUNNER_TEMP/release-assets" \
            "$RUNNER_TEMP/release-work"
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/release-assets/install.sh" \
            "$RUNNER_TEMP/release-assets/rdp-session-manager-installer.zip" \
            --title "RDP Session Manager $GITHUB_REF_NAME" \
            --notes-file "docs/release-notes/${{ steps.version.outputs.value }}.md" \
            --latest \
            --verify-tag
